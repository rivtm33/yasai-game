<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高級やさいゲーム</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    background: linear-gradient(170deg, #cfe8b0 0%, #86c46a 42%, #3f8f56 100%);
    color: #2c4322;
    overflow: hidden; touch-action: none; user-select: none;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; padding: 6px;
  }
  header {
    width: 100%; max-width: 430px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .title {
    font-size: 17px; font-weight: 800; letter-spacing: .5px; line-height: 1.15;
    color: #fff; text-shadow: 0 2px 0 #35703f, 0 4px 8px rgba(0,0,0,.25);
  }
  .title small { display: block; font-size: 10px; opacity: .85; letter-spacing: 2px; }
  .scores { display: flex; gap: 6px; }
  .card {
    background: rgba(255,255,255,.88); border-radius: 12px; padding: 3px 11px;
    box-shadow: 0 2px 0 rgba(0,0,0,.12); text-align: center; min-width: 74px;
  }
  .card .lbl { font-size: 9px; opacity: .6; font-weight: 800; }
  .card .val { font-size: 19px; font-weight: 800; line-height: 1.15; }
  .card .val::before { content: '¥'; font-size: 12px; opacity: .55; margin-right: 1px; }

  #stage {
    position: relative; border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.3), inset 0 0 0 6px #8b5a2b;
    background: #fff9ec;
  }
  canvas { display: block; }

  #nextBox {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,255,255,.82); border-radius: 12px;
    padding: 3px 9px 1px; text-align: center; pointer-events: none;
  }
  #nextBox .lbl { font-size: 9px; font-weight: 800; opacity: .6; }
  #nextBox .emo { font-size: 25px; line-height: 1.1; }

  #tools { display: flex; gap: 6px; width: 100%; max-width: 430px; }
  .tbtn {
    flex: 1; font-family: inherit; font-size: 12px; font-weight: 800;
    padding: 9px 4px; border: none; border-radius: 12px;
    background: rgba(255,255,255,.9); color: #33502a; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); line-height: 1.25;
  }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .tbtn.on { background: #ffb703; color: #4a2c00; box-shadow: 0 3px 0 #cf8f00; }
  .tbtn b { display: block; font-size: 15px; line-height: 1.1; }

  #chart {
    width: 100%; max-width: 430px; display: flex; flex-wrap: wrap;
    justify-content: center; align-items: center; gap: 1px;
    background: rgba(255,255,255,.55); border-radius: 12px; padding: 5px 4px;
  }
  #chart i { font-style: normal; opacity: .38; font-size: 10px; }

  #over {
    position: absolute; inset: 0; background: rgba(28,48,24,.75);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: #fff; backdrop-filter: blur(3px);
  }
  #over.show { display: flex; }
  #over h2 { margin: 0; font-size: 28px; text-shadow: 0 3px 6px rgba(0,0,0,.4); }
  #over .fin { font-size: 14px; opacity: .92; text-align: center; line-height: 1.6; }
  #retry {
    font-family: inherit; font-size: 17px; font-weight: 800;
    padding: 12px 30px; border: none; border-radius: 999px;
    background: #ffb703; color: #4a2c00; cursor: pointer; box-shadow: 0 4px 0 #d18f00;
  }
  #retry:active { transform: translateY(3px); box-shadow: 0 1px 0 #d18f00; }
  .hint { font-size: 10px; color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="title">🍇 高級やさいゲーム<small>もやし → シャインマスカット</small></div>
    <div class="scores">
      <div class="card"><div class="lbl">売上</div><div class="val" id="score">0</div></div>
      <div class="card"><div class="lbl">最高記録</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="nextBox"><div class="lbl">つぎ</div><div class="emo" id="nextEmo">🌱</div></div>
    <div id="over">
      <h2>閉店…</h2>
      <div class="fin" id="finalTxt"></div>
      <button id="retry">もういちど</button>
    </div>
  </div>

  <div id="tools">
    <button class="tbtn" id="btnShuffle"><b>🔀</b>シャッフル<span id="shufLeft"> 3</span></button>
    <button class="tbtn" id="btnAuto"><b>⏩</b>オート</button>
    <button class="tbtn on" id="btnSfx"><b>🔔</b>効果音</button>
    <button class="tbtn on" id="btnBgm"><b>🎵</b>BGM</button>
  </div>

  <div id="chart"></div>
  <div class="hint">クリック / タップで投下　🔀は畑をかき混ぜる（3回まで）</div>
</div>

<script>
(() => {
'use strict';

/* ==========================================================
   野菜テーブル — 「安い順 → 高級」の8段階
   ========================================================== */
const VEG = [
  { name:'もやし',           emo:'🌱', r: 16, color:'#e8f0d0', price:  30 },
  { name:'きゅうり',         emo:'🥒', r: 24, color:'#7cb342', price:  70 },
  { name:'なす',             emo:'🍆', r: 34, color:'#8e6bb5', price: 120 },
  { name:'トマト',           emo:'🍅', r: 46, color:'#ef5350', price: 200 },
  { name:'ブロッコリー',     emo:'🥦', r: 60, color:'#4f9e46', price: 350 },
  { name:'パプリカ',         emo:'🫑', r: 76, color:'#f0a92d', price: 600 },
  { name:'まつたけ',         emo:'🍄', r: 94, color:'#b07a4a', price: 3000 },
  { name:'シャインマスカット',emo:'🍇', r:114, color:'#c5dd6a', price: 8000 },
];
const TOP      = VEG.length - 1;
const MAX_DROP = 2;      // 落とせるのは もやし・きゅうり・なす のみ
const LINE_Y   = 122;
const DROP_Y   = 64;
const COOLDOWN = 400;
const AUTO_CD  = 190;    // オート時の投下間隔
const SHUFFLE_MAX = 3;

/* ==========================================================
   オーディオ（Web Audio でその場生成・外部ファイルなし）
   ========================================================== */
const Audio_ = (() => {
  let ctx = null, master, musicG, sfxG, noiseBuf;
  let sfxOn = true, bgmOn = true;
  let timer = null, stepIdx = 0, nextTime = 0;

  const TEMPO = 86;
  const STEP  = 60 / TEMPO / 4;          // 16分音符
  const mtof  = m => 440 * Math.pow(2, (m - 69) / 12);

  // ゆるいループ進行： Cmaj9 → Am7 → Fmaj7 → G6
  const CHORDS = [
    { bass: 36, notes: [60, 64, 67, 71, 74] },
    { bass: 33, notes: [57, 60, 64, 67, 72] },
    { bass: 29, notes: [57, 60, 65, 69, 72] },
    { bass: 31, notes: [59, 62, 67, 71, 74] },
  ];
  // 16分グリッドのメロディ（chord.notes のインデックス / null は休符）
  const MEL = [
    [2,null,null,0, 1,null,3,null, null,2,null,null, 1,null,null,null],
    [3,null,2,null, null,1,null,null, 2,null,null,0, null,1,null,null],
    [1,null,null,2, 3,null,null,null, 4,null,3,null, null,2,null,null],
    [0,null,2,null, 1,null,null,3, null,null,2,null, 1,null,0,null],
  ];
  const BASS_STEPS  = [0, 6, 10];
  const SHAKE_STEPS = [2, 6, 10, 14];

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    musicG = ctx.createGain(); musicG.gain.value = bgmOn ? 0.5 : 0; musicG.connect(master);
    sfxG   = ctx.createGain(); sfxG.gain.value   = sfxOn ? 0.9 : 0; sfxG.connect(master);

    const len = Math.floor(ctx.sampleRate * 0.5);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    nextTime = ctx.currentTime + 0.1;
    stepIdx = 0;
    timer = setInterval(schedule, 25);
  }
  function resume(){ if (ctx && ctx.state === 'suspended') ctx.resume(); }

  /* ---- 音色 ---- */
  function pluck(t, freq, dur, vol, type, dest){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(900, t + dur);
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(dest || musicG);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function bassNote(t, freq, dur, vol){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 420;
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicG);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function shaker(t, vol, dest){
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = 'highpass'; f.frequency.value = 5200;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(f); f.connect(g); g.connect(dest || musicG);
    s.start(t); s.stop(t + 0.1);
  }
  // ずっこけ系の「ぽよん」
  function boing(t, f0, f1, dur, vol, dest){
    const o = ctx.createOscillator(), g = ctx.createGain();
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.55);
    o.frequency.exponentialRampToValueAtTime(f1 * 0.78, t + dur);
    lfo.type = 'sine'; lfo.frequency.setValueAtTime(17, t);
    lg.gain.setValueAtTime(f0 * 0.09, t);
    lg.gain.exponentialRampToValueAtTime(0.01, t + dur);
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG);
    o.start(t); lfo.start(t);
    o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  }

  /* ---- BGM スケジューラ ---- */
  function schedule(){
    if (!ctx) return;
    while (nextTime < ctx.currentTime + 0.18){
      const bar  = Math.floor(stepIdx / 16) % 4;
      const s    = stepIdx % 16;
      const ch   = CHORDS[bar];
      const swing = (s % 2 === 1) ? STEP * 0.16 : 0;   // ハネ
      const t = nextTime + swing;

      if (BASS_STEPS.includes(s)) bassNote(t, mtof(ch.bass), 0.42, 0.30);

      const mi = MEL[bar][s];
      if (mi !== null && mi !== undefined){
        pluck(t, mtof(ch.notes[mi]), 0.55, 0.16, 'triangle');
        if (Math.random() < 0.28) pluck(t + 0.012, mtof(ch.notes[mi] + 12), 0.3, 0.055, 'sine');
      }
      if (SHAKE_STEPS.includes(s)) shaker(t, s % 4 === 2 ? 0.05 : 0.025);

      // 4小節に一度の おとぼけフレーズ
      if (bar === 3 && s === 14) boing(t, 320, 150, 0.3, 0.10, musicG);
      if (bar === 1 && s === 12) pluck(t, mtof(ch.notes[4] + 12), 0.25, 0.07, 'square');

      nextTime += STEP;
      stepIdx++;
    }
  }

  /* ---- 効果音 ---- */
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  return {
    init, resume,
    get ready(){ return !!ctx; },
    setSfx(v){ sfxOn = v; if (sfxG) sfxG.gain.value = v ? 0.9 : 0; },
    setBgm(v){ bgmOn = v; if (musicG) musicG.gain.setTargetAtTime(v ? 0.5 : 0, ctx.currentTime, 0.15); },

    merge(level){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      const base = mtof(57 + PENTA[Math.min(level, PENTA.length - 1)]);
      boing(t, base * 0.55, base * 1.6, 0.26 + level * 0.02, 0.28);
      shaker(t, 0.10, sfxG);
      // 「ちゅぽん」の抜ける感じ
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base * 2.4, t + 0.02);
      o.frequency.exponentialRampToValueAtTime(base * 0.9, t + 0.14);
      g.gain.setValueAtTime(0.0001, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.035);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(sfxG); o.start(t + 0.02); o.stop(t + 0.22);
      // 高級野菜はキラキラ追加
      if (level >= 5){
        [0, 4, 7, 12, 16].forEach((n, i) =>
          pluck(t + 0.05 + i * 0.055, mtof(76 + n), 0.35, 0.10, 'triangle', sfxG));
      }
    },
    drop(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      boing(t, 220, 130, 0.09, 0.10);
    },
    shuffle(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      for (let i = 0; i < 10; i++)
        pluck(t + i * 0.028, mtof(64 + PENTA[i % PENTA.length]), 0.22, 0.10, 'triangle', sfxG);
      shaker(t, 0.12, sfxG);
    },
    over(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      [67, 64, 60, 55].forEach((n, i) => pluck(t + i * 0.16, mtof(n), 0.5, 0.16, 'triangle', sfxG));
      boing(t + 0.66, 200, 70, 0.7, 0.20);
    },
  };
})();

/* ==========================================================
   キャンバス
   ========================================================== */
const BASE_W = 380, BASE_H = 620;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1;

function fit(){
  const stage = document.getElementById('stage');
  const availH = window.innerHeight - 190;
  const availW = Math.min(window.innerWidth - 16, 430);
  scale = Math.max(0.4, Math.min(availW / BASE_W, availH / BASE_H, 1.1));
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(BASE_W * scale * dpr);
  cv.height = Math.round(BASE_H * scale * dpr);
  cv.style.width  = (BASE_W * scale) + 'px';
  cv.style.height = (BASE_H * scale) + 'px';
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  stage.style.width  = (BASE_W * scale) + 'px';
  stage.style.height = (BASE_H * scale) + 'px';
}

/* ==========================================================
   状態
   ========================================================== */
let balls = [], particles = [], mergeQueue = [];
let score = 0, best = +(localStorage.getItem('yasai_best_v2') || 0);
let curType = 0, nextType = 0;
let aimX = BASE_W / 2;
let lastDrop = -9999, dangerT = 0, gameOver = false;
let shuffleLeft = SHUFFLE_MAX, autoOn = false, shuffleFx = 0;
let idSeq = 1, topReached = false;

const $score = document.getElementById('score');
const $best  = document.getElementById('best');
const $next  = document.getElementById('nextEmo');
const $over  = document.getElementById('over');
const $final = document.getElementById('finalTxt');
const $shuf  = document.getElementById('btnShuffle');
const $shufL = document.getElementById('shufLeft');
const $auto  = document.getElementById('btnAuto');

const randType = () => Math.floor(Math.random() * (MAX_DROP + 1));
const yen = n => n.toLocaleString('ja-JP');

function reset(){
  balls = []; particles = []; mergeQueue = [];
  score = 0; dangerT = 0; gameOver = false; topReached = false;
  lastDrop = -9999; shuffleLeft = SHUFFLE_MAX;
  setAuto(false);
  curType = randType(); nextType = randType();
  $over.classList.remove('show');
  updateHud();
}

function updateHud(){
  $score.textContent = yen(score);
  $best.textContent  = yen(best);
  $next.textContent  = VEG[nextType].emo;
  $shufL.textContent = ' ' + shuffleLeft;
  $shuf.disabled = shuffleLeft <= 0 || gameOver;
}

/* ==========================================================
   物理（Position Based Dynamics）
   ========================================================== */
const G_BASE = 2100, ITER = 7, SUB = 2, WALL_FRIC = 0.86, AIR = 0.999;

function addBall(type, x, y, vx = 0, vy = 0){
  balls.push({
    id: idSeq++, type, x, y, px: x - vx / 60, py: y - vy / 60,
    vx, vy, r: VEG[type].r, rot: Math.random() * 6.28,
    rv: (Math.random() - .5) * 2, born: performance.now(), pop: 1, dead: false
  });
}

function step(dt){
  const h = dt / SUB;
  const G = G_BASE * (autoOn ? 2.0 : 1);
  for (let s = 0; s < SUB; s++){
    for (const b of balls){
      b.vy += G * h;
      b.vx *= AIR; b.vy *= AIR;
      b.px = b.x; b.py = b.y;
      b.x += b.vx * h; b.y += b.vy * h;
      b.rot += b.rv * h; b.rv *= 0.985;
    }
    for (let k = 0; k < ITER; k++){ solvePairs(k === 0); solveWalls(); }
    for (const b of balls){
      b.vx = (b.x - b.px) / h;
      b.vy = (b.y - b.py) / h;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 3000){ const f = 3000 / sp; b.vx *= f; b.vy *= f; }
      if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 6);
    }
  }
}

function solvePairs(checkMerge){
  const n = balls.length;
  for (let i = 0; i < n; i++){
    const a = balls[i];
    if (a.dead) continue;
    for (let j = i + 1; j < n; j++){
      const b = balls[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, minD = a.r + b.r;
      if (Math.abs(dx) > minD || Math.abs(dy) > minD) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD || d2 === 0) continue;
      const d = Math.sqrt(d2);

      if (checkMerge && a.type === b.type && a.type < TOP){
        a.dead = true; b.dead = true;
        mergeQueue.push({ a, b });
        break;
      }

      const nx = dx / d, ny = dy / d, ov = (minD - d) * 0.5;
      const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
      const wa = mb / tot, wb = ma / tot;
      a.x -= nx * ov * 2 * wa; a.y -= ny * ov * 2 * wa;
      b.x += nx * ov * 2 * wb; b.y += ny * ov * 2 * wb;

      const tang = (-ny) * ((b.x - b.px) - (a.x - a.px)) + nx * ((b.y - b.py) - (a.y - a.py));
      a.rv -= tang / a.r * 0.4;
      b.rv += tang / b.r * 0.4;
    }
  }
}

function solveWalls(){
  for (const b of balls){
    if (b.dead) continue;
    if (b.x - b.r < 0){ b.x = b.r; b.py += (b.y - b.py) * (1 - WALL_FRIC); }
    else if (b.x + b.r > BASE_W){ b.x = BASE_W - b.r; b.py += (b.y - b.py) * (1 - WALL_FRIC); }
    if (b.y + b.r > BASE_H){
      b.y = BASE_H - b.r;
      const s = b.x - b.px;
      b.px += s * (1 - WALL_FRIC);
      b.rv += s / b.r * 6;
    }
  }
}

function doMerges(){
  if (!mergeQueue.length) return;
  for (const m of mergeQueue){
    const { a, b } = m;
    const nt = a.type + 1;
    const nr = VEG[nt].r;
    // 合体後は一回り大きくなるので、生成位置を場内に収めておく
    const x = Math.max(nr, Math.min(BASE_W - nr, (a.x + b.x) / 2));
    const y = Math.min((a.y + b.y) / 2, BASE_H - nr);
    score += VEG[nt].price;
    addBall(nt, x, y, (a.vx + b.vx) / 2 * 0.4, (a.vy + b.vy) / 2 * 0.4 - 40);
    balls[balls.length - 1].pop = 0.55;
    burst(x, y, VEG[nt].color, VEG[nt].r);
    Audio_.merge(nt);
    if (nt === TOP){
      topReached = true;
      burst(x, y, '#ffffff', VEG[nt].r * 1.5);
      burst(x, y, '#ffe066', VEG[nt].r * 1.2);
    }
  }
  mergeQueue = [];
  balls = balls.filter(b => !b.dead);
  if (score > best){ best = score; localStorage.setItem('yasai_best_v2', best); }
  updateHud();
}

/* ==========================================================
   エフェクト
   ========================================================== */
function burst(x, y, color, r){
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * Math.PI * 2 + Math.random() * .5;
    const sp = 70 + Math.random() * 190;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
                     life: 1, color, size: 2 + Math.random() * (r * .12) });
  }
}
function stepParticles(dt){
  for (const p of particles){
    p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt * 1.8;
  }
  particles = particles.filter(p => p.life > 0);
}

/* ==========================================================
   投下・シャッフル・オート
   ========================================================== */
const clampAim = (x, type) => {
  const r = VEG[type].r;
  return Math.max(r + 1, Math.min(BASE_W - r - 1, x));
};
function toLocal(e){
  const rect = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  return (cx - rect.left) / scale;
}

function drop(){
  if (gameOver) return;
  const now = performance.now();
  if (now - lastDrop < (autoOn ? AUTO_CD : COOLDOWN)) return;
  lastDrop = now;
  addBall(curType, clampAim(aimX, curType), DROP_Y, 0, autoOn ? 320 : 60);
  Audio_.drop();
  curType = nextType;
  nextType = randType();
  updateHud();
}

/* 畑をかき混ぜる： 位置はそのままに野菜の種類を入れ替える */
function doShuffle(){
  if (gameOver || shuffleLeft <= 0 || balls.length < 2) return;
  shuffleLeft--;
  const types = balls.map(b => b.type);
  for (let i = types.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }
  balls.forEach((b, i) => {
    b.type = types[i];
    b.r = VEG[types[i]].r;
    b.vx = (Math.random() - .5) * 90;
    b.vy = -60 - Math.random() * 60;
    b.px = b.x - b.vx / 60; b.py = b.y - b.vy / 60;
    b.rv = (Math.random() - .5) * 6;
    b.pop = 0.6;
    b.born = performance.now();       // 直後の判定に猶予を与える
  });
  dangerT = 0;
  shuffleFx = 1;
  Audio_.shuffle();
  updateHud();
}

/* オート投下のねらい所 */
function autoAim(){
  // 同じ種類の野菜があればその上を狙う
  let target = null;
  for (const b of balls){
    if (b.type !== curType) continue;
    if (!target || b.y < target.y) target = b;
  }
  if (target) return target.x + (Math.random() - .5) * 10;

  // なければ一番くぼんでいる所へ
  const r = VEG[curType].r;
  let bestX = BASE_W / 2, bestY = -1;
  for (let x = r + 2; x <= BASE_W - r - 2; x += 12){
    let surface = BASE_H;
    for (const b of balls){
      const dx = Math.abs(b.x - x);
      if (dx < b.r + r) surface = Math.min(surface, b.y - b.r);
    }
    if (surface > bestY){ bestY = surface; bestX = x; }
  }
  return bestX;
}

function setAuto(v){
  autoOn = v;
  $auto.classList.toggle('on', v);
}

/* ==========================================================
   入力
   ========================================================== */
function wake(){ Audio_.init(); Audio_.resume(); }

cv.addEventListener('mousemove', e => { if (!autoOn) aimX = toLocal(e); });
cv.addEventListener('mousedown', e => { wake(); if (!autoOn) aimX = toLocal(e); });
cv.addEventListener('click',     e => { wake(); if (!autoOn){ aimX = toLocal(e); drop(); } });
cv.addEventListener('touchstart', e => { wake(); if (!autoOn) aimX = toLocal(e); e.preventDefault(); }, { passive:false });
cv.addEventListener('touchmove',  e => { if (!autoOn) aimX = toLocal(e); e.preventDefault(); }, { passive:false });
cv.addEventListener('touchend',   e => { if (!autoOn) drop(); e.preventDefault(); }, { passive:false });

$shuf.addEventListener('click', () => { wake(); doShuffle(); });
$auto.addEventListener('click', () => { wake(); setAuto(!autoOn); });

const $sfx = document.getElementById('btnSfx');
const $bgm = document.getElementById('btnBgm');
$sfx.addEventListener('click', () => {
  wake();
  const on = !$sfx.classList.contains('on');
  $sfx.classList.toggle('on', on); Audio_.setSfx(on);
});
$bgm.addEventListener('click', () => {
  wake();
  const on = !$bgm.classList.contains('on');
  $bgm.classList.toggle('on', on); Audio_.setBgm(on);
});
document.getElementById('retry').addEventListener('click', () => { wake(); reset(); });
window.addEventListener('resize', fit);

/* ==========================================================
   ゲームオーバー判定
   ========================================================== */
function checkOver(dt){
  if (gameOver) return;
  const now = performance.now();
  let over = false;
  for (const b of balls){
    if (now - b.born < 1200) continue;
    if (Math.hypot(b.vx, b.vy) > 90) continue;
    if (b.y - b.r < LINE_Y){ over = true; break; }
  }
  dangerT = over ? dangerT + dt : 0;
  if (dangerT > 1.1){
    gameOver = true;
    setAuto(false);
    const msg = topReached ? 'シャインマスカット 達成！🍇' : `あと ${yen(VEG[TOP].price - score > 0 ? VEG[TOP].price - score : 0)} で最高級…`;
    $final.innerHTML = `本日の売上 <b>¥${yen(score)}</b><br>最高記録 ¥${yen(best)}<br>${msg}`;
    Audio_.over();
    updateHud();
  }
}

/* ==========================================================
   描画
   ========================================================== */
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const cl = c => Math.max(0, Math.min(255, c + amt));
  return `rgb(${cl(n >> 16 & 255)},${cl(n >> 8 & 255)},${cl(n & 255)})`;
}

function drawVeg(b){
  const v = VEG[b.type];
  const pop = b.pop === undefined ? 1 : b.pop;
  const sq = 1 + (1 - pop) * 0.35;      // 合体直後のぷるん
  ctx.save();
  ctx.translate(b.x, b.y);

  ctx.beginPath();
  ctx.arc(0, 3, b.r, 0, 6.2832);
  ctx.fillStyle = 'rgba(120,90,50,.18)';
  ctx.fill();

  ctx.scale(sq, 2 - sq);
  const g = ctx.createRadialGradient(-b.r * .35, -b.r * .4, b.r * .15, 0, 0, b.r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(.45, v.color);
  g.addColorStop(1, shade(v.color, -30));
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, 6.2832);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, b.r * .06);
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.stroke();

  ctx.rotate(b.rot);
  ctx.font = `${(b.r * 1.45).toFixed(1)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(v.emo, 0, b.r * .04);
  ctx.restore();
}

function render(){
  ctx.clearRect(0, 0, BASE_W, BASE_H);
  const bg = ctx.createLinearGradient(0, 0, 0, BASE_H);
  bg.addColorStop(0, '#fffaf0'); bg.addColorStop(1, '#ffe9c4');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  if (shuffleFx > 0){
    ctx.fillStyle = `rgba(255,255,255,${shuffleFx * .55})`;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  const warn = dangerT > 0.15;
  ctx.save();
  ctx.setLineDash([9, 7]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = warn
    ? `rgba(230,60,60,${.5 + Math.sin(performance.now() / 90) * .4})`
    : 'rgba(200,120,60,.45)';
  ctx.beginPath(); ctx.moveTo(0, LINE_Y); ctx.lineTo(BASE_W, LINE_Y); ctx.stroke();
  ctx.restore();

  if (!gameOver){
    const ax = clampAim(aimX, curType);
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = autoOn ? 'rgba(255,150,0,.5)' : 'rgba(90,120,70,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, DROP_Y); ctx.lineTo(ax, BASE_H); ctx.stroke();
    ctx.restore();

    const ready = performance.now() - lastDrop >= (autoOn ? AUTO_CD : COOLDOWN);
    ctx.globalAlpha = ready ? 1 : 0.35;
    drawVeg({ x: ax, y: DROP_Y, r: VEG[curType].r, type: curType, rot: 0, pop: 1 });
    ctx.globalAlpha = 1;
  }

  for (const b of balls) drawVeg(b);

  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (autoOn && !gameOver){
    ctx.fillStyle = 'rgba(255,140,0,.85)';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('⏩ AUTO', 10, 10);
  }
}

/* ==========================================================
   ループ
   ========================================================== */
let prev = performance.now();
function loop(now){
  let dt = (now - prev) / 1000;
  prev = now;
  if (dt > 0.05) dt = 0.05;

  if (!gameOver){
    if (autoOn && now - lastDrop >= AUTO_CD){ aimX = autoAim(); drop(); }
    step(dt);
    doMerges();
    checkOver(dt);
  }
  stepParticles(dt);
  if (shuffleFx > 0) shuffleFx = Math.max(0, shuffleFx - dt * 3);
  render();
  requestAnimationFrame(loop);
}

/* ==========================================================
   進化チャート
   ========================================================== */
(function buildChart(){
  const el = document.getElementById('chart');
  VEG.forEach((v, i) => {
    const s = document.createElement('span');
    s.textContent = v.emo;
    s.title = `${v.name}　¥${yen(v.price)}`;
    s.style.fontSize = (13 + i * 2.1) + 'px';
    el.appendChild(s);
    if (i < VEG.length - 1){
      const a = document.createElement('i');
      a.textContent = '▸';
      el.appendChild(a);
    }
  });
})();

fit();
reset();
requestAnimationFrame(loop);
})();
</script>
