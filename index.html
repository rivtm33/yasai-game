<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シャインマスカットゲーム</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    background: linear-gradient(170deg, #d8ecb4 0%, #8ec96f 42%, #3e8f57 100%);
    color: #2c4322; overflow: hidden; touch-action: none; user-select: none;
  }
  #wrap { height: 100%; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 6px; padding: 6px; }
  header { width: 100%; max-width: 430px; display: flex;
           align-items: center; justify-content: space-between; gap: 8px; }
  .title { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; line-height: 1.15;
           color: #fff; text-shadow: 0 2px 0 #35703f, 0 4px 8px rgba(0,0,0,.25);
           overflow: hidden; text-overflow: ellipsis; }
  .title small { display: block; font-size: 9px; opacity: .85; letter-spacing: 1px; }
  .scores { display: flex; gap: 6px; }
  .card { background: rgba(255,255,255,.9); border-radius: 12px; padding: 3px 10px;
          box-shadow: 0 2px 0 rgba(0,0,0,.12); text-align: center; min-width: 72px; }
  .card .lbl { font-size: 9px; opacity: .6; font-weight: 800; }
  .card .val { font-size: 18px; font-weight: 800; line-height: 1.15; }

  #stage { position: relative; border-radius: 18px; overflow: hidden;
           box-shadow: 0 10px 30px rgba(0,0,0,.3), inset 0 0 0 6px #8b5a2b; background: #fff9ec; }
  canvas { display: block; }

  #nextBox { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,.85);
             border-radius: 12px; padding: 3px 8px 5px; text-align: center; pointer-events: none; }
  #nextBox .lbl { font-size: 9px; font-weight: 800; opacity: .6; }
  #nextBox canvas { border-radius: 50%; }

  /* ずる用のゆさぶりボタン */
  /* ゆさぶり・シャッフル（盤面の外に置く） */
  #shakeRow { display: flex; gap: 6px; width: 100%; max-width: 430px; }
  .sbtn {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 800;
    padding: 11px 4px; border: none; border-radius: 12px;
    background: #fff3d0; color: #6b4a12; cursor: pointer;
    box-shadow: 0 3px 0 #d9b871; white-space: nowrap;
  }
  .sbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d9b871; }
  .sbtn.mid { background: #d9f0c0; color: #2f5220; box-shadow: 0 3px 0 #9dc57e; flex: 1.15; }

  #tools { display: flex; gap: 6px; width: 100%; max-width: 430px; }
  .tbtn { flex: 1; font-family: inherit; font-size: 11px; font-weight: 800;
          padding: 8px 3px; border: none; border-radius: 12px;
          background: rgba(255,255,255,.9); color: #33502a; cursor: pointer;
          box-shadow: 0 3px 0 rgba(0,0,0,.18); line-height: 1.25; }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .tbtn.on { background: #ffb703; color: #4a2c00; box-shadow: 0 3px 0 #cf8f00; }
  a.tbtn { text-decoration: none; text-align: center; display: block; }
  .tbtn b { display: block; font-size: 14px; line-height: 1.1; }

  #chartBox { width: 100%; max-width: 430px;
              background: rgba(255,255,255,.72); border-radius: 14px; padding: 7px 6px 9px;
              box-shadow: 0 3px 10px rgba(0,0,0,.14); }
  #chartBox .head { font-size: 10px; font-weight: 800; opacity: .55;
                    text-align: center; letter-spacing: 1px; margin-bottom: 4px; }
  #chartBox canvas { display: block; margin: 0 auto; }

  .overlay { position: absolute; inset: 0; background: rgba(28,48,24,.8);
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 12px; color: #fff; backdrop-filter: blur(3px); padding: 16px; text-align: center; }
  .overlay.hide { display: none; }
  .overlay h2 { margin: 0; font-size: 24px; text-shadow: 0 3px 6px rgba(0,0,0,.4); }
  .overlay p { margin: 0; font-size: 12px; opacity: .9; line-height: 1.7; }
  .lvBtn { font-family: inherit; font-size: 17px; font-weight: 800; width: 210px;
           padding: 12px 10px; border: none; border-radius: 999px;
           background: #ffb703; color: #4a2c00; cursor: pointer; box-shadow: 0 4px 0 #d18f00; }
  .lvBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d18f00; }
  .lvBtn small { display: block; font-size: 10px; font-weight: 700; opacity: .75; }
  /* ------- タイトル画面 ------- */
  #title { background: #ffd23f; padding: 0; overflow: hidden; backdrop-filter: none; }
  #title .burst {
    position: absolute; left: 50%; top: 42%; width: 260%; height: 260%;
    transform-origin: 50% 50%; margin: -130% 0 0 -130%;
    background: repeating-conic-gradient(from 0deg, #ffe27a 0deg 11deg, #ffc42e 11deg 22deg);
    animation: spinBurst 34s linear infinite;
  }
  @keyframes spinBurst { to { transform: rotate(360deg); } }
  #title .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%,
      rgba(255,255,255,.92) 0%, rgba(255,255,255,.45) 30%,
      rgba(255,214,110,.15) 55%, rgba(233,130,20,.42) 100%);
  }
  #title .inner {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6%;
  }
  .logo {
    max-width: 88%; font-size: clamp(20px, 8vw, 42px); font-weight: 900; line-height: 1.08;
    color: #fff; letter-spacing: 1px; transform: rotate(-4deg);
    animation: logoPop 2.6s ease-in-out infinite;
    text-shadow:
      -4px -4px 0 #e8620f, 0 -4px 0 #e8620f, 4px -4px 0 #e8620f,
      -4px  0   0 #e8620f, 4px  0   0 #e8620f,
      -4px  4px 0 #e8620f, 0  4px 0 #e8620f, 4px  4px 0 #e8620f,
       0    9px 0 rgba(150,62,0,.55), 0 14px 18px rgba(0,0,0,.28);
  }
  .logo span { display: block; font-size: .52em; letter-spacing: 6px; margin-top: .12em; }
  @keyframes logoPop {
    0%,100% { transform: rotate(-4deg) scale(1); }
    50%     { transform: rotate(-2deg) scale(1.05); }
  }
  #titleFaces { position: absolute; inset: 0; pointer-events: none; }
  #titleFaces canvas {
    position: absolute; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 5px 12px rgba(0,0,0,.28); animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0)     rotate(-6deg); }
    50%     { transform: translateY(-11px) rotate(6deg); }
  }
  .spark { position: absolute; font-size: 18px; animation: twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.7);} 50%{opacity:1;transform:scale(1.15);} }
  .startBtn {
    position: relative; font-family: inherit; font-size: 20px; font-weight: 900;
    padding: 14px 44px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(#63c34a, #3f9c2f); color: #fff;
    box-shadow: 0 5px 0 #2c7420, 0 8px 16px rgba(0,0,0,.28);
    text-shadow: 0 2px 0 rgba(0,0,0,.25); animation: btnPulse 1.6s ease-in-out infinite;
  }
  .startBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2c7420; }
  /* つづきから が出ているときは、はじめる を控えめにする */
  #startBtn.secondary {
    background: linear-gradient(#fff2cf, #ffdf9a); color: #6b4a12;
    box-shadow: 0 4px 0 #d3ad5c, 0 6px 12px rgba(0,0,0,.2);
    font-size: 15px; padding: 10px 26px; text-shadow: none; animation: none;
  }
  #startBtn.secondary:active { box-shadow: 0 1px 0 #d3ad5c; }
  @keyframes btnPulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }
  .hint { font-size: 10px; color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="title" id="hdTitle">🍇 シャインマスカットゲーム<small id="hdSub">もやし から 高級ぶどうを目指せ</small></div>
    <div class="scores">
      <div class="card"><div class="lbl">スコア</div><div class="val" id="score">0</div></div>
      <div class="card"><div class="lbl">ハイスコア</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="nextBox"><div class="lbl">つぎ</div><canvas id="nextCv" width="46" height="46"></canvas></div>
    <div class="overlay hide" id="over">
      <h2 id="overTitle">お疲れさまでした！</h2>
      <div class="fin" id="finalTxt"></div>
      <button class="lvBtn" id="retry">もういちど</button>
    </div>

    <div class="overlay" id="title">
      <div class="burst"></div>
      <div class="glow"></div>
      <div id="titleFaces"></div>
      <div class="inner">
        <div class="logo" id="logoText"></div>
        <button class="startBtn" id="resumeBtn" style="display:none">つづきから</button>
        <button class="startBtn" id="startBtn">はじめる</button>
      </div>
    </div>
  </div>

  <div id="shakeRow">
    <button class="sbtn" id="tiltL">◀ ゆさぶる</button>
    <button class="sbtn mid" id="btnShuffle">🔀 シャッフル</button>
    <button class="sbtn" id="tiltR">ゆさぶる ▶</button>
  </div>

  <div id="tools">
    <button class="tbtn" id="btnAuto"><b>⏩</b>オート</button>
    <button class="tbtn on" id="btnSfx"><b>🔔</b>効果音</button>
    <button class="tbtn on" id="btnBgm"><b>🎵</b>BGM</button>
    <a class="tbtn" id="btnRank" href="ranking.html"><b>🏆</b>きろく</a>
  </div>

  <div id="chartBox">
    <div class="head" id="chartHead">そだつ じゅんばん</div>
    <canvas id="chartCv"></canvas>
  </div>
  <div class="hint">タップした場所に落とす　◀▶ でカゴをゆさぶる　🔀 は何度でも使える</div>
</div>

   オーディオ（すべて Web Audio で合成）
   ========================================================== */
const Audio_ = (() => {
  let ctx = null, master, musicG, sfxG, noiseBuf;
  let sfxOn = true, bgmOn = true;
  let stepIdx = 0, nextTime = 0;

  const TEMPO = 86, STEP = 60 / 86 / 4;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [
    { bass: 36, notes: [60, 64, 67, 71, 74] },
    { bass: 33, notes: [57, 60, 64, 67, 72] },
    { bass: 29, notes: [57, 60, 65, 69, 72] },
    { bass: 31, notes: [59, 62, 67, 71, 74] },
  ];
  const MEL = [
    [2,null,null,0, 1,null,3,null, null,2,null,null, 1,null,null,null],
    [3,null,2,null, null,1,null,null, 2,null,null,0, null,1,null,null],
    [1,null,null,2, 3,null,null,null, 4,null,3,null, null,2,null,null],
    [0,null,2,null, 1,null,null,3, null,null,2,null, 1,null,0,null],
  ];
  const BASS_STEPS = [0, 6, 10], SHAKE_STEPS = [2, 6, 10, 14];
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    musicG = ctx.createGain(); musicG.gain.value = bgmOn ? 0.5 : 0; musicG.connect(master);
    sfxG   = ctx.createGain(); sfxG.gain.value   = sfxOn ? 0.9 : 0; sfxG.connect(master);
    const len = Math.floor(ctx.sampleRate * 0.5);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.1;
    setInterval(schedule, 25);
  }
  function resume(){ if (ctx && ctx.state === 'suspended') ctx.resume(); }

  function pluck(t, freq, dur, vol, type, dest){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(900, t + dur);
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(dest || musicG);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function bassNote(t, freq, dur, vol){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 420;
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicG);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function shaker(t, vol, dest, hp){
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = 'highpass'; f.frequency.value = hp || 5200;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(f); f.connect(g); g.connect(dest || musicG);
    s.start(t); s.stop(t + 0.12);
  }
  function boing(t, f0, f1, dur, vol, dest){
    const o = ctx.createOscillator(), g = ctx.createGain();
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.55);
    o.frequency.exponentialRampToValueAtTime(f1 * 0.78, t + dur);
    lfo.type = 'sine'; lfo.frequency.setValueAtTime(17, t);
    lg.gain.setValueAtTime(f0 * 0.09, t);
    lg.gain.exponentialRampToValueAtTime(0.01, t + dur);
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  }
  function schedule(){
    if (!ctx) return;
    while (nextTime < ctx.currentTime + 0.18){
      const bar = Math.floor(stepIdx / 16) % 4, s = stepIdx % 16, ch = CHORDS[bar];
      const t = nextTime + ((s % 2 === 1) ? STEP * 0.16 : 0);
      if (BASS_STEPS.includes(s)) bassNote(t, mtof(ch.bass), 0.42, 0.30);
      const mi = MEL[bar][s];
      if (mi !== null && mi !== undefined){
        pluck(t, mtof(ch.notes[mi]), 0.55, 0.16, 'triangle');
        if (Math.random() < 0.28) pluck(t + 0.012, mtof(ch.notes[mi] + 12), 0.3, 0.055, 'sine');
      }
      if (SHAKE_STEPS.includes(s)) shaker(t, s % 4 === 2 ? 0.05 : 0.025);
      if (bar === 3 && s === 14) boing(t, 320, 150, 0.3, 0.10, musicG);
      if (bar === 1 && s === 12) pluck(t, mtof(ch.notes[4] + 12), 0.25, 0.07, 'square');
      nextTime += STEP; stepIdx++;
    }
  }

  return {
    init, resume,
    setSfx(v){ sfxOn = v; if (sfxG) sfxG.gain.value = v ? 0.9 : 0; },
    setBgm(v){ bgmOn = v; if (musicG && ctx) musicG.gain.setTargetAtTime(v ? 0.5 : 0, ctx.currentTime, 0.15); },
    duckBgm(sec){
      if (!ctx || !musicG || !bgmOn) return;
      const t = ctx.currentTime;
      musicG.gain.cancelScheduledValues(t);
      musicG.gain.setValueAtTime(musicG.gain.value, t);
      musicG.gain.linearRampToValueAtTime(0.10, t + 0.08);
      musicG.gain.setValueAtTime(0.10, t + sec);
      musicG.gain.linearRampToValueAtTime(0.5, t + sec + 0.5);
    },

    merge(level){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      const base = mtof(57 + PENTA[Math.min(level, PENTA.length - 1)]);
      boing(t, base * 0.55, base * 1.6, 0.26 + level * 0.02, 0.28);
      shaker(t, 0.10, sfxG);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base * 2.4, t + 0.02);
      o.frequency.exponentialRampToValueAtTime(base * 0.9, t + 0.14);
      g.gain.setValueAtTime(0.0001, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.035);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(sfxG); o.start(t + 0.02); o.stop(t + 0.22);
      if (level >= 5)
        [0, 4, 7, 12, 16].forEach((n, i) =>
          pluck(t + 0.05 + i * 0.055, mtof(76 + n), 0.35, 0.10, 'triangle', sfxG));
    },

    /* シャインマスカット到達ファンファーレ */
    muscat(){
      if (!ctx) return;
      this.duckBgm(2.4);
      if (!sfxOn) return;
      const t = ctx.currentTime;
      // 駆け上がり
      [60,64,67,72,76,79,84].forEach((n, i) =>
        pluck(t + i * 0.062, mtof(n), 0.45, 0.20, 'triangle', sfxG));
      // ファンファーレ和音（3連）
      const hit = (dt, notes, vol) => notes.forEach(n => {
        pluck(t + 0.55 + dt, mtof(n), 0.75, vol, 'square', sfxG);
        pluck(t + 0.55 + dt, mtof(n - 12), 0.75, vol * 0.6, 'triangle', sfxG);
      });
      hit(0.00, [72, 76, 79], 0.13);
      hit(0.20, [72, 76, 79], 0.13);
      hit(0.42, [74, 79, 83], 0.16);
      hit(0.72, [76, 81, 84, 88], 0.18);
      // キラキラ
      for (let i = 0; i < 16; i++)
        pluck(t + 1.0 + i * 0.05, mtof(84 + PENTA[i % PENTA.length]), 0.5, 0.055, 'sine', sfxG);
      boing(t + 0.5, 180, 90, 0.5, 0.16);
    },

    /* 最終段どうしが合わさって消えるとき */
    muscatPop(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      shaker(t, 0.22, sfxG, 1200);
      [88,84,79,76,72,67,64,60].forEach((n, i) =>
        pluck(t + i * 0.045, mtof(n), 0.5, 0.14, 'sine', sfxG));
      boing(t + 0.05, 900, 120, 0.55, 0.24);
    },

    drop(){ if (ctx && sfxOn) boing(ctx.currentTime, 220, 130, 0.09, 0.10); },

    shuffle(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      for (let i = 0; i < 12; i++)
        pluck(t + i * 0.026, mtof(64 + PENTA[i % PENTA.length]), 0.22, 0.09, 'triangle', sfxG);
      for (let i = 0; i < 6; i++) shaker(t + i * 0.06, 0.11, sfxG, 3000);
    },

    tilt(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      shaker(t, 0.10, sfxG, 2200);
      boing(t, 150, 110, 0.14, 0.08);
    },

    over(){
      if (!ctx || !sfxOn) return;
      const t = ctx.currentTime;
      [67, 64, 60, 55].forEach((n, i) => pluck(t + i * 0.16, mtof(n), 0.5, 0.16, 'triangle', sfxG));
      boing(t + 0.66, 200, 70, 0.7, 0.20);
    },
  };
})();

/* ==========================================================
   キャンバス
   ========================================================== */
const BASE_W = 380, BASE_H = 620;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let scale = 1;

function fit(){
  const stage = document.getElementById('stage');
  // 盤面以外（ヘッダ・ボタン・凡例・ヒント）の実寸を測り、残りを盤面に配る
  const h = sel => { const el = document.querySelector(sel); return el ? el.getBoundingClientRect().height : 0; };
  const other = h('header') + h('#shakeRow') + h('#tools') + h('#chartBox') + h('.hint');
  const availH = window.innerHeight - other - 44;
  const availW = Math.min(window.innerWidth - 16, 430);
  scale = Math.max(0.4, Math.min(availW / BASE_W, availH / BASE_H, 1.1));
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(BASE_W * scale * dpr);
  cv.height = Math.round(BASE_H * scale * dpr);
  cv.style.width = (BASE_W * scale) + 'px';
  cv.style.height = (BASE_H * scale) + 'px';
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  stage.style.width = (BASE_W * scale) + 'px';
  stage.style.height = (BASE_H * scale) + 'px';
}

/* ==========================================================
   状態
   ========================================================== */
let balls = [], particles = [], mergeQueue = [], popQueue = [];
let score = 0, best = +(localStorage.getItem('muscat_best_pt') || 0);
let curType = 0, nextType = 0, aimX = BASE_W / 2;
let lastDrop = -9999, lastShuffle = -9999, lastTilt = -9999;
let dangerT = 0, gameOver = false, started = false;   // タイトル画面の「はじめる」で開始
let autoOn = false, shuffleFx = 0, shakeT = 0, shakeAmp = 0, celebrate = 0;
let idSeq = 1, topReached = false, popped = 0, topMade = 0, levelKey = 'hard';

const $score = document.getElementById('score');
const $best  = document.getElementById('best');
const $over  = document.getElementById('over');
const $final = document.getElementById('finalTxt');
const $auto  = document.getElementById('btnAuto');
const nextCv = document.getElementById('nextCv'), nctx = nextCv.getContext('2d');

const randType = () => Math.floor(Math.random() * (L.maxDrop + 1));
const num = n => n.toLocaleString('ja-JP');

function applyLevel(key){
  levelKey = LEVELS[key] ? key : 'hard';
  L = LEVELS[levelKey];
  R = VEG.map(v => Math.round(v.r * L.sz));
}

/* ==========================================================
   途中経過の自動保存
   盤面は「種類と座標と速度の数字」だけなので、そのまま文字にして
   端末の localStorage に置く。サーバーには何も送らない。
   ========================================================== */
const SAVE_KEY = 'muscat_save';
const SAVE_V = 2;

function saveState(){
  if (!started || gameOver || !balls.length) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: SAVE_V, lv: levelKey, score, cur: curType, next: nextType,
      made: topMade, pop: popped, ts: Date.now(),
      b: balls.map(b => [b.type, +b.x.toFixed(1), +b.y.toFixed(1),
                         +b.vx.toFixed(1), +b.vy.toFixed(1), +b.rot.toFixed(2)])
    }));
  } catch (e) {}
}
function loadState(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || d.v !== SAVE_V || !Array.isArray(d.b) || !d.b.length) return null;
    if (!LEVELS[d.lv]) return null;
    return d;
  } catch (e) { return null; }
}
function clearState(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function restoreState(d){
  applyLevel(d.lv);
  balls = []; particles = []; mergeQueue = []; popQueue = [];
  const now = performance.now();
  for (const a of d.b){
    const nb = addBall(a[0] | 0, a[1], a[2], a[3], a[4]);
    nb.rot = a[5] || 0;
    nb.born = now;                 // 復帰直後は行き詰まり判定に猶予を与える
  }
  score = d.score || 0;
  curType = d.cur | 0; nextType = d.next | 0;
  topMade = d.made || 0; popped = d.pop || 0;
  dangerT = 0; gameOver = false; lastDrop = -9999;
  celebrate = 0; shakeAmp = 0; shakeT = 0; shuffleFx = 0;
  setAuto(false);
  $over.classList.add('hide');
  updateHud();
  buildChart();
}

/* 1プレイの結果を記録（ランキングページが読む） */
const RUNS_KEY = 'muscat_runs';
function loadRuns(){
  try { const a = JSON.parse(localStorage.getItem(RUNS_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function saveRun(){
  const t = new Date();
  const day = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  const runs = loadRuns();
  const nth = runs.filter(r => r.day === day).length + 1;
  runs.push({ day, nth, lv: levelKey, lvLabel: L.label,
              made: topMade, popped, score, ts: t.getTime() });
  try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs.slice(-400))); } catch (e) {}
  return nth;
}

function reset(){
  balls = []; particles = []; mergeQueue = []; popQueue = [];
  score = 0; dangerT = 0; gameOver = false; topReached = false; popped = 0; topMade = 0;
  lastDrop = -9999; celebrate = 0; shakeAmp = 0; shakeT = 0;
  setAuto(false);
  curType = randType(); nextType = randType();
  $over.classList.add('hide');
  updateHud();
}

function updateHud(){
  $score.textContent = num(score);
  $best.textContent  = num(best);
  drawNextPreview();
}

function drawNextPreview(){
  const s = nextCv.width;
  nctx.clearRect(0, 0, s, s);
  nctx.save();
  nctx.beginPath(); nctx.arc(s/2, s/2, s/2 - 1, 0, 6.2832); nctx.clip();
  if (imgOk(nextType)) nctx.drawImage(IMGS[nextType], 0, 0, s, s);
  else { nctx.fillStyle = VEG[nextType].color; nctx.fillRect(0, 0, s, s); }
  nctx.restore();
}

/* ==========================================================
   物理（Position Based Dynamics）
   ========================================================== */
const G_BASE = 2100, ITER = 7, SUB = 2, WALL_FRIC = 0.86, AIR = 0.999;

function addBall(type, x, y, vx = 0, vy = 0){
  balls.push({
    id: idSeq++, type, x, y, px: x - vx / 60, py: y - vy / 60, vx, vy,
    r: R[type], rot: Math.random() * 6.28, rv: (Math.random() - .5) * 2,
    born: performance.now(), pop: 1, dead: false
  });
  return balls[balls.length - 1];
}

function step(dt){
  const h = dt / SUB, G = G_BASE * (autoOn ? 2.0 : 1);
  for (let s = 0; s < SUB; s++){
    for (const b of balls){
      b.vy += G * h;
      b.vx *= AIR; b.vy *= AIR;
      b.px = b.x; b.py = b.y;
      b.x += b.vx * h; b.y += b.vy * h;
      b.rot += b.rv * h; b.rv *= 0.985;
    }
    for (let k = 0; k < ITER; k++){ solvePairs(k === 0); solveWalls(); }
    for (const b of balls){
      b.vx = (b.x - b.px) / h;
      b.vy = (b.y - b.py) / h;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 3000){ const f = 3000 / sp; b.vx *= f; b.vy *= f; }
      if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 6);
    }
  }
}

function solvePairs(checkMerge){
  const n = balls.length;
  for (let i = 0; i < n; i++){
    const a = balls[i];
    if (a.dead) continue;
    for (let j = i + 1; j < n; j++){
      const b = balls[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, minD = a.r + b.r;
      if (Math.abs(dx) > minD || Math.abs(dy) > minD) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD || d2 === 0) continue;
      const d = Math.sqrt(d2);

      if (checkMerge && a.type === b.type){
        if (a.type < TOP){ a.dead = b.dead = true; mergeQueue.push({ a, b }); break; }
        // 最終段どうしは消滅して特大ボーナス
        a.dead = b.dead = true; popQueue.push({ a, b }); break;
      }

      const nx = dx / d, ny = dy / d, ov = (minD - d) * 0.5;
      const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
      const wa = mb / tot, wb = ma / tot;
      a.x -= nx * ov * 2 * wa; a.y -= ny * ov * 2 * wa;
      b.x += nx * ov * 2 * wb; b.y += ny * ov * 2 * wb;
      const tang = (-ny) * ((b.x - b.px) - (a.x - a.px)) + nx * ((b.y - b.py) - (a.y - a.py));
      a.rv -= tang / a.r * 0.4;
      b.rv += tang / b.r * 0.4;
    }
  }
}

function solveWalls(){
  for (const b of balls){
    if (b.dead) continue;
    if (b.x - b.r < 0){ b.x = b.r; b.py += (b.y - b.py) * (1 - WALL_FRIC); }
    else if (b.x + b.r > BASE_W){ b.x = BASE_W - b.r; b.py += (b.y - b.py) * (1 - WALL_FRIC); }
    if (b.y + b.r > BASE_H){
      b.y = BASE_H - b.r;
      const s = b.x - b.px;
      b.px += s * (1 - WALL_FRIC);
      b.rv += s / b.r * 6;
    }
  }
}

function doMerges(){
  if (mergeQueue.length){
    for (const { a, b } of mergeQueue){
      const nt = a.type + 1, nr = R[nt];
      const x = Math.max(nr, Math.min(BASE_W - nr, (a.x + b.x) / 2));
      const y = Math.min((a.y + b.y) / 2, BASE_H - nr);
      score += VEG[nt].pt;
      const nb = addBall(nt, x, y, (a.vx + b.vx) / 2 * 0.4, (a.vy + b.vy) / 2 * 0.4 - 40);
      nb.pop = 0.55;
      burst(x, y, VEG[nt].color, nr);
      if (nt === TOP){
        topReached = true; topMade++;
        celebrate = 2.6;
        shake(9);
        burst(x, y, '#ffffff', nr * 1.5);
        burst(x, y, '#ffe066', nr * 1.3);
        Audio_.muscat();
      } else {
        Audio_.merge(nt);
      }
    }
    mergeQueue = [];
  }
  if (popQueue.length){
    for (const { a, b } of popQueue){
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      score += TOP_BONUS; popped++;
      burst(x, y, '#ffffff', R[TOP] * 1.6);
      burst(x, y, '#c3d76a', R[TOP] * 1.4);
      shake(12);
      Audio_.muscatPop();
    }
    popQueue = [];
  }
  balls = balls.filter(b => !b.dead);
  if (score > best){ best = score; localStorage.setItem('muscat_best_pt', best); }
  updateHud();
}

/* ==========================================================
   エフェクト
   ========================================================== */
function burst(x, y, color, r){
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * Math.PI * 2 + Math.random() * .5;
    const sp = 70 + Math.random() * 190;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
                     life: 1, color, size: 2 + Math.random() * (r * .12) });
  }
}
function stepParticles(dt){
  for (const p of particles){
    p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt * 1.8;
  }
  particles = particles.filter(p => p.life > 0);
}
function shake(amp){ shakeAmp = Math.max(shakeAmp, amp); shakeT = 0; }

/* ==========================================================
   投下・ゆさぶり・シャッフル・オート
   ========================================================== */
const clampAim = (x, type) => Math.max(R[type] + 1, Math.min(BASE_W - R[type] - 1, x));
function toLocal(e){
  const rect = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  return (cx - rect.left) / scale;
}

function drop(){
  if (gameOver || !started) return;
  const now = performance.now();
  if (now - lastDrop < (autoOn ? AUTO_CD : L.cd)) return;
  lastDrop = now;
  addBall(curType, clampAim(aimX, curType), DROP_Y, 0, autoOn ? 320 : 60);
  Audio_.drop();
  curType = nextType; nextType = randType();
  updateHud();
}

/* ずる: カゴを横からゆさぶる */
function tilt(dir){
  if (gameOver || !started) return;
  const now = performance.now();
  if (now - lastTilt < 260) return;
  lastTilt = now;
  for (const b of balls){
    b.vx += dir * (170 + Math.random() * 90);
    b.vy -= 40 + Math.random() * 50;
    b.rv += dir * 3;
  }
  shake(7 * dir);
  dangerT = Math.max(0, dangerT - 0.4);
  Audio_.tilt();
}

/* シャッフル: グラグラ揺らして中身を入れ替える（回数無制限） */
function doShuffle(){
  if (gameOver || !started || balls.length < 2) return;
  const now = performance.now();
  if (now - lastShuffle < SHUFFLE_CD) return;
  lastShuffle = now;

  const types = balls.map(b => b.type);
  for (let i = types.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }
  balls.forEach((b, i) => {
    b.type = types[i];
    b.r = R[types[i]];
    b.vx = (Math.random() - .5) * 220;
    b.vy = -90 - Math.random() * 90;
    b.px = b.x - b.vx / 60; b.py = b.y - b.vy / 60;
    b.rv = (Math.random() - .5) * 8;
    b.pop = 0.6;
    b.born = performance.now();
  });
  dangerT = 0; shuffleFx = 1;
  shake(14);
  Audio_.shuffle();
}

function autoAim(){
  let target = null;
  for (const b of balls){
    if (b.type !== curType) continue;
    if (!target || b.y < target.y) target = b;
  }
  if (target) return target.x + (Math.random() - .5) * 10;
  const r = R[curType];
  let bx = BASE_W / 2, by = -1;
  for (let x = r + 2; x <= BASE_W - r - 2; x += 12){
    let surface = BASE_H;
    for (const b of balls) if (Math.abs(b.x - x) < b.r + r) surface = Math.min(surface, b.y - b.r);
    if (surface > by){ by = surface; bx = x; }
  }
  return bx;
}
function setAuto(v){ autoOn = v; $auto.classList.toggle('on', v); }

/* ==========================================================
   入力
   ========================================================== */
function wake(){ Audio_.init(); Audio_.resume(); }

cv.addEventListener('mousemove', e => { if (!autoOn) aimX = toLocal(e); });
cv.addEventListener('mousedown', e => { wake(); if (!autoOn) aimX = toLocal(e); });
cv.addEventListener('click',     e => { wake(); if (!autoOn){ aimX = toLocal(e); drop(); } });
cv.addEventListener('touchstart', e => { wake(); if (!autoOn) aimX = toLocal(e); e.preventDefault(); }, { passive:false });
cv.addEventListener('touchmove',  e => { if (!autoOn) aimX = toLocal(e); e.preventDefault(); }, { passive:false });
cv.addEventListener('touchend',   e => { if (!autoOn) drop(); e.preventDefault(); }, { passive:false });

document.getElementById('btnShuffle').addEventListener('click', () => { wake(); doShuffle(); });
$auto.addEventListener('click', () => { wake(); setAuto(!autoOn); });
document.getElementById('tiltL').addEventListener('click', () => { wake(); tilt(-1); });
document.getElementById('tiltR').addEventListener('click', () => { wake(); tilt(1); });

const $sfx = document.getElementById('btnSfx'), $bgm = document.getElementById('btnBgm');
$sfx.addEventListener('click', () => {
  wake(); const on = !$sfx.classList.contains('on');
  $sfx.classList.toggle('on', on); Audio_.setSfx(on);
});
$bgm.addEventListener('click', () => {
  wake(); const on = !$bgm.classList.contains('on');
  $bgm.classList.toggle('on', on); Audio_.setBgm(on);
});

document.getElementById('retry').addEventListener('click', () => {
  wake();
  clearState();
  $over.classList.add('hide');
  reset();
  started = true;
});
document.getElementById('startBtn').addEventListener('click', () => {
  wake();
  clearState();
  document.getElementById('title').classList.add('hide');
  reset();
  started = true;
  fit();
});
document.getElementById('resumeBtn').addEventListener('click', () => {
  wake();
  const d = loadState();
  document.getElementById('title').classList.add('hide');
  if (d) { restoreState(d); } else { reset(); }
  started = true;
  fit();
});

/* 中断されても消えないように、こまめに保存する */
setInterval(saveState, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);
window.addEventListener('beforeunload', saveState);
/* きろくのページへ移る直前にも保存 */
document.getElementById('btnRank').addEventListener('click', saveState);
window.addEventListener('resize', fit);

/* ==========================================================
   ゲームオーバー
   ========================================================== */
function checkOver(dt){
  if (gameOver) return;
  const now = performance.now();
  let over = false;
  for (const b of balls){
    if (now - b.born < 1200) continue;
    if (Math.hypot(b.vx, b.vy) > 90) continue;
    if (b.y - b.r < L.lineY){ over = true; break; }
  }
  dangerT = over ? dangerT + dt : 0;
  if (dangerT > L.danger){
    gameOver = true; setAuto(false);
    const nth = saveRun();
    const total = topMade;   // 消えた分も作った時点で数えている
    const msg = total > 0
      ? `${THEME.emoji} ${THEME.top} が <b style="font-size:20px">${total}</b> ${THEME.unit} できました`
      : THEME.none;
    const cheer = score >= best && score > 0 ? '<br>自己ベスト更新！おめでとう 🎉' : '';
    $final.innerHTML =
      `<p>きょう ${nth} 回目</p>` +
      `<p>スコア <b style="font-size:24px">${num(score)}</b>　じぶんの記録 ${num(best)}${cheer}</p>` +
      `<p>${msg}<br>${THEME.bye}</p>` +
      `<p><a href="ranking.html" style="color:#ffd66b">🏆 きろくを見る</a></p>`;
    $over.classList.remove('hide');
    clearState();          // 終わった盤面は復元しない
    Audio_.over();
    updateHud();
  }
}

/* ==========================================================
   描画
   ========================================================== */
function shadeCol(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const cl = c => Math.max(0, Math.min(255, c + amt));
  return `rgb(${cl(n >> 16 & 255)},${cl(n >> 8 & 255)},${cl(n & 255)})`;
}

function drawVeg(b){
  const v = VEG[b.type], r = b.r;
  const pop = b.pop === undefined ? 1 : b.pop;
  const sq = 1 + (1 - pop) * 0.35;
  ctx.save();
  ctx.translate(b.x, b.y);

  ctx.beginPath(); ctx.arc(0, r * .1, r, 0, 6.2832);
  ctx.fillStyle = 'rgba(120,90,50,.20)'; ctx.fill();

  ctx.scale(sq, 2 - sq);
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.clip();
  if (imgOk(b.type)){
    ctx.rotate(b.rot);
    ctx.drawImage(IMGS[b.type], -r * 1.02, -r * 1.02, r * 2.04, r * 2.04);
    ctx.rotate(-b.rot);
  } else {
    const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .15, 0, 0, r);
    g.addColorStop(0, '#fff'); g.addColorStop(.45, v.color);
    g.addColorStop(1, shadeCol(v.color, -30));
    ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2);
  }
  // 立体感（ハイライトと縁の陰り）
  const gl = ctx.createRadialGradient(-r * .38, -r * .45, r * .05, -r * .1, -r * .1, r * 1.25);
  gl.addColorStop(0, 'rgba(255,255,255,.55)');
  gl.addColorStop(.35, 'rgba(255,255,255,.10)');
  gl.addColorStop(.75, 'rgba(0,0,0,0)');
  gl.addColorStop(1, 'rgba(0,0,0,.32)');
  ctx.fillStyle = gl; ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.restore();

  ctx.lineWidth = Math.max(1.5, r * .05);
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function render(dt){
  ctx.clearRect(0, 0, BASE_W, BASE_H);
  const bg = ctx.createLinearGradient(0, 0, 0, BASE_H);
  bg.addColorStop(0, '#fffaf0'); bg.addColorStop(1, '#ffe9c4');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, BASE_W, BASE_H);

  // 背景写真: ぼかした写真で全面を埋め、その上に写真全体を収めて置く
  if (bgOk()){
    const iw = BGIMG.naturalWidth, ih = BGIMG.naturalHeight;
    ctx.save();
    try { ctx.filter = 'blur(16px)'; } catch (e) {}
    const sc = Math.max(BASE_W / iw, BASE_H / ih) * 1.15;
    ctx.drawImage(BGIMG, (BASE_W - iw * sc) / 2, (BASE_H - ih * sc) / 2, iw * sc, ih * sc);
    ctx.restore();

    const sf = Math.min(BASE_W / iw, BASE_H / ih);
    const dw = iw * sf, dh = ih * sf;
    ctx.drawImage(BGIMG, (BASE_W - dw) / 2, (BASE_H - dh) / 2, dw, dh);

    ctx.fillStyle = 'rgba(255,250,238,.55)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  if (celebrate > 0){
    const a = Math.min(.5, celebrate * .22) * (0.5 + 0.5 * Math.sin(performance.now() / 70));
    ctx.fillStyle = `rgba(255,255,190,${a})`;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }
  if (shuffleFx > 0){
    ctx.fillStyle = `rgba(255,255,255,${shuffleFx * .5})`;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  // ゆさぶり中は中身だけを揺らす
  const ox = shakeAmp * Math.sin(shakeT * 34) * Math.exp(-shakeT * 4);
  const oy = shakeAmp * 0.25 * Math.sin(shakeT * 51) * Math.exp(-shakeT * 4);
  ctx.save();
  ctx.translate(ox, oy);

  const warn = dangerT > 0.15;
  ctx.save();
  ctx.setLineDash([9, 7]); ctx.lineWidth = 2;
  ctx.strokeStyle = warn ? `rgba(230,60,60,${.5 + Math.sin(performance.now() / 90) * .4})`
                         : 'rgba(200,120,60,.45)';
  ctx.beginPath(); ctx.moveTo(-20, L.lineY); ctx.lineTo(BASE_W + 20, L.lineY); ctx.stroke();
  ctx.restore();

  if (started && !gameOver){
    const ax = clampAim(aimX, curType);
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = autoOn ? 'rgba(255,150,0,.5)' : 'rgba(90,120,70,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, DROP_Y); ctx.lineTo(ax, BASE_H); ctx.stroke();
    ctx.restore();
    const ready = performance.now() - lastDrop >= (autoOn ? AUTO_CD : L.cd);
    ctx.globalAlpha = ready ? 1 : 0.35;
    drawVeg({ x: ax, y: DROP_Y, r: R[curType], type: curType, rot: 0, pop: 1 });
    ctx.globalAlpha = 1;
  }

  for (const b of balls) drawVeg(b);

  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (celebrate > 0){
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 30px "Hiragino Maru Gothic ProN", system-ui, sans-serif';
    const y = 200 - (2.6 - celebrate) * 26;
    ctx.globalAlpha = Math.min(1, celebrate / 1.2);
    ctx.lineWidth = 7; ctx.strokeStyle = '#4a3a00';
    ctx.strokeText(THEME.cheer, BASE_W / 2, y);
    ctx.fillStyle = '#fff36b';
    ctx.fillText(THEME.cheer, BASE_W / 2, y);
    ctx.restore();
  }

  if (autoOn && started && !gameOver){
    ctx.fillStyle = 'rgba(255,140,0,.85)';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('⏩ AUTO', 10, 10);
  }
}

/* ==========================================================
   ループ
   ========================================================== */
let prev = performance.now();
function loop(now){
  let dt = (now - prev) / 1000; prev = now;
  if (dt > 0.05) dt = 0.05;

  if (started && !gameOver){
    if (autoOn && now - lastDrop >= AUTO_CD){ aimX = autoAim(); drop(); }
    step(dt); doMerges(); checkOver(dt);
  }
  stepParticles(dt);
  if (shuffleFx > 0) shuffleFx = Math.max(0, shuffleFx - dt * 3);
  if (celebrate > 0) celebrate = Math.max(0, celebrate - dt);
  if (shakeAmp !== 0){
    shakeT += dt;
    if (shakeT > 1.2) { shakeAmp = 0; shakeT = 0; }
  }
  render(dt);
  requestAnimationFrame(loop);
}

/* ==========================================================
   進化チャート
   ========================================================== */
/* そだつ順番を輪に並べて描く */
function buildChart(){
  const c = document.getElementById('chartCv');
  const CS = 142, dpr = window.devicePixelRatio || 1;
  c.width = CS * dpr; c.height = CS * dpr;
  c.style.width = CS + 'px'; c.style.height = CS + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, CS, CS);

  const cx = CS / 2, cy = CS / 2, ring = 52;
  const n = VEG.length;
  const ang = i => -Math.PI / 2 + (i / n) * Math.PI * 2;   // 真上から時計回り
  // 隣どうしが重ならない大きさに抑える（弦の長さ 2*ring*sin(π/n) 未満）
  const rad = i => 6.5 + i * 1.7;

  // 輪の下地
  g.save();
  g.setLineDash([3, 5]);
  g.strokeStyle = 'rgba(120,100,60,.28)';
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx, cy, ring, 0, 6.2832); g.stroke();
  g.restore();

  // 進む向きの矢印
  g.save();
  g.strokeStyle = '#7bbf52'; g.fillStyle = '#7bbf52';
  g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, ring - 13, -Math.PI * 0.62, -Math.PI * 0.20); g.stroke();
  const ta = -Math.PI * 0.20, tx = cx + Math.cos(ta) * (ring - 13), ty = cy + Math.sin(ta) * (ring - 13);
  g.translate(tx, ty); g.rotate(ta + Math.PI / 2);
  g.beginPath(); g.moveTo(0, 5); g.lineTo(-4.5, -4); g.lineTo(4.5, -4); g.closePath(); g.fill();
  g.restore();

  VEG.forEach((v, i) => {
    const a = ang(i), r = rad(i);
    const x = cx + Math.cos(a) * ring, y = cy + Math.sin(a) * ring;
    g.save();
    g.beginPath(); g.arc(x, y + 1.5, r, 0, 6.2832);
    g.fillStyle = 'rgba(90,70,40,.18)'; g.fill();
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.clip();
    if (imgOk(i)) g.drawImage(IMGS[i], x - r, y - r, r * 2, r * 2);
    else { g.fillStyle = v.color; g.fillRect(x - r, y - r, r * 2, r * 2); }
    g.restore();
    g.beginPath(); g.arc(x, y, r, 0, 6.2832);
    g.lineWidth = i === n - 1 ? 3 : 2;
    g.strokeStyle = i === n - 1 ? '#ffcf3d' : '#fff';
    g.stroke();
  });

  // 中央は絵文字だけ（名前を置くと輪の写真とぶつかる）
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '20px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  g.fillText('🏆', cx, cy);
  c.title = VEG.map(v => `${v.name} ${v.pt}点`).join(' → ');
}

/* タイトル画面（顔をふわふわ浮かべる） */
function buildTitle(){
  const box = document.getElementById('titleFaces');
  box.innerHTML = '';
  const spots = [
    { i: TOP, l: 50, t: 74, s: 66 },
    { i: 1,   l: 13, t: 20, s: 46 },
    { i: 5,   l: 84, t: 24, s: 52 },
    { i: 3,   l: 10, t: 55, s: 40 },
    { i: 6,   l: 87, t: 58, s: 44 },
  ];
  spots.forEach((p, k) => {
    const c = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    c.width = p.s * dpr; c.height = p.s * dpr;
    c.style.width = p.s + 'px'; c.style.height = p.s + 'px';
    c.style.left = `calc(${p.l}% - ${p.s / 2}px)`;
    c.style.top  = `calc(${p.t}% - ${p.s / 2}px)`;
    c.style.animationDelay = (k * 0.4) + 's';
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.save(); g.beginPath(); g.arc(p.s/2, p.s/2, p.s/2, 0, 6.2832); g.clip();
    if (imgOk(p.i)) g.drawImage(IMGS[p.i], 0, 0, p.s, p.s);
    else { g.fillStyle = VEG[p.i].color; g.fillRect(0, 0, p.s, p.s); }
    g.restore();
    box.appendChild(c);
  });
  [[22,44],[70,12],[90,44],[34,84],[64,88]].forEach(([l, t], k) => {
    const s = document.createElement('div');
    s.className = 'spark'; s.textContent = '✨';
    s.style.left = l + '%'; s.style.top = t + '%';
    s.style.animationDelay = (k * 0.35) + 's';
    box.appendChild(s);
  });
}

function applyTheme(){
  document.title = THEME.doc;
  document.getElementById('hdTitle').firstChild.nodeValue = THEME.head;
  const $sub = document.getElementById('hdSub');
  $sub.textContent = THEME.sub || '';
  $sub.style.display = THEME.sub ? '' : 'none';
  document.getElementById('overTitle').textContent = THEME.over;
  document.getElementById('chartHead').textContent = 'そだつ じゅんばん';
  const parts = THEME.logo ||
    (THEME.doc.endsWith('ゲーム') ? [THEME.doc.slice(0, -3), 'ゲーム'] : [THEME.doc, '']);
  const $logo = document.getElementById('logoText');
  $logo.textContent = parts[0];
  $logo.style.fontSize = parts[0].length > 7 ? 'clamp(17px, 6.2vw, 30px)' : '';
  if (parts[1]){
    const sp = document.createElement('span');
    sp.textContent = parts[1];
    $logo.appendChild(sp);
  }
  // ランキングページが見出しに使う
  try {
    localStorage.setItem('muscat_doc_title', THEME.doc);
    localStorage.setItem('muscat_top_label', THEME.top);
    localStorage.setItem('muscat_top_unit', THEME.unit);
    localStorage.setItem('muscat_top_emoji', THEME.emoji);
  } catch (e) {}
}

/* 保存された途中経過があれば「つづきから」を出す */
function refreshTitleButtons(){
  const d = loadState();
  const $r = document.getElementById('resumeBtn');
  const $s = document.getElementById('startBtn');
  if (d){
    $r.style.display = '';
    $r.textContent = `つづきから（${num(d.score || 0)}点）`;
    $s.textContent = 'さいしょから';
    $s.classList.add('secondary');
  } else {
    $r.style.display = 'none';
    $s.textContent = 'はじめる';
    $s.classList.remove('secondary');
  }
}

applyTheme();
applyLevel('hard');
updateHud();
buildChart();
buildTitle();
refreshTitleButtons();
fit();
setTimeout(() => { buildChart(); buildTitle(); fit(); }, 600);   // 画像の読み込み後にもう一度
requestAnimationFrame(loop);
})();
